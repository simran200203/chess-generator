<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess960 core — tests</title>
  <style>
    body { font: 14px/1.5 ui-monospace, "IBM Plex Mono", monospace;
           background: #1B2027; color: #E8E6E1; margin: 0; padding: 24px; }
    h1 { font-size: 18px; font-weight: 600; }
    #summary { font-size: 16px; padding: 8px 0 16px; }
    .pass { color: #7FB069; }
    .fail { color: #E06C5A; }
    .signal { color: #E0A63C; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 2px 0; }
    li.fail { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Chess960 core — tests</h1>
  <div id="summary">running…</div>
  <ul id="results"></ul>

  <script type="module">
    import {
      ERRORS, squareColor, validateBackRank,
      idToBackRank, backRankToId,
      backRankToFEN, castlingField, toStandardCastling,
      legalCompletions, mulberry32,
    } from '../core/index.js';
    import { weightsForStrength, weightedPick } from '../generate/selection.js';
    import { insufficientMaterial, repetitionKey } from '../generate/rules.js';
    import {
      winPct, computeHopelessPly, winnerOf, matchesTarget, CRITERIA, hopelessLabel,
    } from '../generate/score.js';
    import { classifyGame, material } from '../generate/classify.js';
    import { moveToSan } from '../generate/san.js';
    import { toPGN, toJSON } from '../generate/pgn.js';

    // --- 30-line harness ---------------------------------------------------
    let passed = 0, failed = 0;
    const results = document.getElementById('results');
    function record(ok, msg) {
      ok ? passed++ : failed++;
      const li = document.createElement('li');
      li.className = ok ? 'pass' : 'fail';
      li.textContent = `${ok ? 'PASS' : 'FAIL'}  ${msg}`;
      results.appendChild(li);
      (ok ? console.log : console.error)(`${ok ? 'PASS' : 'FAIL'}  ${msg}`);
    }
    const ok = (cond, msg) => record(!!cond, msg);
    const eq = (a, b, msg) =>
      record(a === b, `${msg}${a === b ? '' : `  (got ${JSON.stringify(a)}, expected ${JSON.stringify(b)})`}`);
    function throws(fn, msg) {
      let threw = false;
      try { fn(); } catch { threw = true; }
      record(threw, msg);
    }

    // --- Scharnagl round-trip and anchors ----------------------------------
    let roundTripOk = true;
    for (let id = 0; id < 960; id++) {
      if (backRankToId(idToBackRank(id)) !== id) { roundTripOk = false; break; }
    }
    ok(roundTripOk, 'idToBackRank ∘ backRankToId is identity for all 960 IDs');
    eq(idToBackRank(518), 'RNBQKBNR', 'ID 518 is the standard back rank');
    eq(backRankToId('RNBQKBNR'), 518, 'standard back rank is ID 518');

    // --- Structural invariants across all 960 ------------------------------
    let allValid = true, bishopsOpposite = true, kingBetween = true;
    for (let id = 0; id < 960; id++) {
      const rank = idToBackRank(id);
      if (!validateBackRank(rank).valid) { allValid = false; break; }
      const bf = [...rank].map((c, i) => (c === 'B' ? i : -1)).filter((i) => i >= 0);
      if (squareColor(bf[0]) === squareColor(bf[1])) bishopsOpposite = false;
      const k = rank.indexOf('K'), r1 = rank.indexOf('R'), r2 = rank.lastIndexOf('R');
      if (!(k > r1 && k < r2)) kingBetween = false;
    }
    ok(allValid, 'every generated position validates as legal');
    ok(bishopsOpposite, 'bishops on opposite colours in all 960');
    ok(kingBetween, 'king between the rooks in all 960');

    // --- A legal non-standard example --------------------------------------
    // NOTE: the CLAUDE.md example "BNRNQKBR" is actually illegal — its bishops
    // sit on a and g, both dark squares. We assert its rejection below, and use
    // "BNRBQKNR" (rooks on c and h) as the legal non-standard example.
    ok(validateBackRank('BNRBQKNR').valid, 'BNRBQKNR validates as legal');

    // --- One specific failing string per validation rule -------------------
    const failsWith = (str, err, label) => {
      const { valid, errors } = validateBackRank(str);
      record(!valid && errors.includes(err), `${label}: "${str}" → ${err}`);
    };
    failsWith('RNBQKB', ERRORS.length, 'length rule');
    failsWith('NNBQKBNR', ERRORS.rooks, 'rook-count rule');       // R=1
    failsWith('RRBQKBBR', ERRORS.knights, 'knight-count rule');   // N=0
    failsWith('RNNQKNNR', ERRORS.bishops, 'bishop-count rule');   // B=0
    failsWith('RNBNKBNR', ERRORS.queens, 'queen-count rule');     // Q=0
    failsWith('RNBQQBNR', ERRORS.kings, 'king-count rule');       // K=0
    failsWith('RBNBQKNR', ERRORS.bishopColor, 'bishop-colour rule'); // B on b,d
    failsWith('KRBNQBNR', ERRORS.kingBetweenRooks, 'king-between-rooks rule');
    // The doc's mistaken example is illegal for the bishop-colour reason:
    failsWith('BNRNQKBR', ERRORS.bishopColor, 'BNRNQKBR is illegal (bishops on a,g)');

    // --- FEN generation ----------------------------------------------------
    eq(backRankToFEN('RNBQKBNR'),
      'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w AHah - 0 1',
      'standard FEN uses X-FEN castling AHah');
    eq(castlingField('BNRBQKNR'), 'CHch', 'rooks on c and h give CHch');
    ok(backRankToFEN('BNRBQKNR').includes(' w CHch '),
      'non-standard FEN carries the CHch castling field');

    // --- toStandardCastling ------------------------------------------------
    eq(toStandardCastling(backRankToFEN('RNBQKBNR')),
      'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
      'toStandardCastling round-trips ID 518 to KQkq');
    ok(toStandardCastling('8/8/8/8/8/8/8/8 w - - 0 1').includes(' - '),
      'toStandardCastling leaves "-" untouched');

    // --- legalCompletions --------------------------------------------------
    eq(legalCompletions(new Array(8).fill(null)).length, 960,
      'empty rank has 960 legal completions');
    const std = legalCompletions([...'RNBQKBNR']);
    eq(std.length, 1, 'a fully-placed legal rank completes to exactly itself');
    eq(std[0], 'RNBQKBNR', 'that completion is the rank itself');
    eq(legalCompletions(['Q', 'Q', null, null, null, null, null, null]).length, 0,
      'an impossible placement (two queens) has no completion');
    const rookA = legalCompletions(['R', null, null, null, null, null, null, null]);
    ok(rookA.length > 1 && rookA.every((r) => r[0] === 'R'),
      'a rook on file a leaves many completions, all with a rook on a');

    // --- mulberry32 determinism --------------------------------------------
    const g1 = mulberry32(12345), g2 = mulberry32(12345);
    ok(g1() === g2() && g1() === g2(), 'same seed yields the same stream');
    ok(mulberry32(1)() !== mulberry32(2)(), 'different seeds diverge');

    // --- strength-weighted selection ---------------------------------------
    const sum = (a) => a.reduce((x, y) => x + y, 0);
    eq(weightsForStrength(0.85, 1)[0], 1, 'one candidate always gives weight 1');
    ok(Math.abs(sum(weightsForStrength(0.7, 3)) - 1) < 1e-9, 'weights sum to 1');
    eq(weightsForStrength(1, 3)[0], 1, 'strength 1 puts all weight on the best move');
    ok(weightsForStrength(0.9, 3)[0] > weightsForStrength(0.6, 3)[0],
      'higher strength → higher best-move probability');
    const w3 = weightsForStrength(0.7, 3);
    ok(w3[1] > w3[2], 'line 2 is weighted above line 3');
    // weightedPick maps r deterministically across the cumulative bands.
    eq(weightedPick([0.7, 0.2, 0.1], 0.0), 0, 'pick: r at band start → index 0');
    eq(weightedPick([0.7, 0.2, 0.1], 0.8), 1, 'pick: r in second band → index 1');
    eq(weightedPick([0.7, 0.2, 0.1], 0.95), 2, 'pick: r in third band → index 2');

    // --- Draw rules --------------------------------------------------------
    ok(insufficientMaterial('8/8/4k3/8/8/4K3/8/8 w - - 0 1'), 'K v K is insufficient material');
    ok(insufficientMaterial('8/8/4k3/8/8/4K3/5B2/8 w - - 0 1'), 'K+B v K is insufficient material');
    ok(!insufficientMaterial('8/4P3/4k3/8/8/4K3/8/8 w - - 0 1'), 'K+P v K is sufficient material');
    eq(repetitionKey('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 5 9'),
      'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -',
      'repetition key drops the move clocks');

    // --- Convergence scoring -----------------------------------------------
    ok(Math.abs(winPct(800) - 95) < 0.5, '±800cp maps to ~95% win probability');
    eq(computeHopelessPly([0, 0, 0, 0, 0, 850, 900, 920, 950, 1000, 1100, 1200], 800, 6), 5,
      'hopeless ply is the first of a sustained lost run');
    eq(computeHopelessPly([0, 900, 0, 0, 0, 0], 800, 6), null, 'a lone spike is not hopeless');
    eq(winnerOf({ type: 'decisive', winner: 'w' }), 'w', 'winnerOf reads a decisive winner');
    eq(winnerOf({ type: 'threefold' }), null, 'a draw has no winner');
    ok(matchesTarget({ type: 'threefold' }, 'draw'), 'threefold satisfies the Draw target');
    ok(!matchesTarget({ type: 'decisive', winner: 'b' }, 'white'), 'a Black win fails the White target');
    const G = (evals, plies, moves, result) => ({ evals, plies, moves, result });
    ok(CRITERIA['largest-swing'].score(G([0, 0, 0, 600, 0], [], [0, 0, 0, 0]), 'w')
      > CRITERIA['largest-swing'].score(G([0, 100, 200, 300, 400], [], [0, 0, 0, 0]), 'w'),
      'largest-swing prefers the bigger single turning point');
    ok(CRITERIA['cleanest-winner'].score(G([], [{ side: 'w', dropWinPct: 2 }], ['a'], {}), 'w')
      > CRITERIA['cleanest-winner'].score(G([], [{ side: 'w', dropWinPct: 25 }], ['a'], {}), 'w'),
      'cleanest-winner prefers fewer conceded win%');
    eq(hopelessLabel(27), 'Position becomes lost at move 14 (White), ply 27.',
      'hopeless label names the move and the ply');

    // --- Classification (§8) -----------------------------------------------
    eq(material('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1', 'w'), 39,
      'starting material is 39 points');
    {
      const start = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
      const afterBlack = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR b KQkq - 0 1';
      const blunder = classifyGame(
        { moves: ['a2a3'], fens: [start, afterBlack] },
        [{ cpWhite: 0, bestMove: 'e2e4', secondCpWhite: 0 }, { cpWhite: -800, bestMove: null, secondCpWhite: null }],
      );
      eq(blunder[0].kind, 'blunder', 'a 45-point win% drop is a blunder');
      eq(blunder[0].glyph, '??', 'blunder glyph is ??');
      const clean = classifyGame(
        { moves: ['a2a3'], fens: [start, afterBlack] },
        [{ cpWhite: 0, bestMove: 'e2e4', secondCpWhite: 0 }, { cpWhite: 10, bestMove: null, secondCpWhite: null }],
      );
      eq(clean[0], null, 'a tiny change is unclassified');
    }

    // --- SAN generation ----------------------------------------------------
    const startFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
    eq(moveToSan(startFen, 'e2e4', [], { checkers: [], noLegal: false }), 'e4', 'pawn push SAN');
    eq(moveToSan(startFen, 'g1f3', ['g1f3', 'b1c3'], { checkers: [], noLegal: false }), 'Nf3', 'knight SAN');
    eq(moveToSan('r3k2r/8/8/8/8/8/8/R3K2R w AHah - 0 1', 'e1h1', ['e1h1'], { checkers: [], noLegal: false }),
      'O-O', 'kingside castling SAN is O-O');
    eq(moveToSan('4k3/8/8/8/8/8/8/R6R w - - 0 1', 'a1d1', ['a1d1', 'h1d1'], { checkers: [], noLegal: false }),
      'Rad1', 'rook move disambiguates by file');
    eq(moveToSan(startFen, 'g1f3', ['g1f3'], { checkers: ['e4'], noLegal: false }), 'Nf3+', 'check suffix +');
    eq(moveToSan(startFen, 'g1f3', ['g1f3'], { checkers: ['e4'], noLegal: true }), 'Nf3#', 'mate suffix #');

    // --- PGN / JSON export -------------------------------------------------
    {
      const afterE4 = 'rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1';
      const g = {
        startFen, moves: ['e2e4'], san: ['e4'], fens: [startFen, afterE4],
        deep: [
          { cpWhite: 20, evalWhite: { type: 'cp', value: 20 } },
          { cpWhite: 30, evalWhite: { type: 'cp', value: 30 } },
        ],
        annotations: [null], result: { type: 'decisive', winner: 'w' }, hopelessPly: 1,
        whiteStrength: 0.9, blackStrength: 0.6, criterion: 'largest-swing', seed: 42, variant: 'Standard',
      };
      const pgn = toPGN(g);
      ok(pgn.includes('[Result "1-0"]'), 'PGN has the result tag');
      ok(pgn.includes(`[FEN "${startFen}"]`), 'PGN carries the start FEN');
      ok(pgn.includes('1. e4'), 'PGN movetext is SAN');
      ok(pgn.includes('[%eval 0.30]'), 'PGN includes per-move eval comments');
      ok(pgn.includes('position becomes lost here'), 'PGN marks the hopeless move');
      const json = JSON.parse(toJSON(g));
      eq(json.moves[0].san, 'e4', 'JSON records SAN');
      eq(json.result.winner, 'w', 'JSON records the winner');
      eq(json.hopelessPly, 1, 'JSON records the hopeless ply');
    }

    // --- Summary -----------------------------------------------------------
    const summary = document.getElementById('summary');
    summary.textContent = `${passed} passed, ${failed} failed`;
    summary.className = failed === 0 ? 'pass' : 'fail';
    console.log(`\n${passed} passed, ${failed} failed`);
  </script>
</body>
</html>
